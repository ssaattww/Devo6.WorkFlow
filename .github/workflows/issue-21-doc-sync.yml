name: Issue 21 documentation synchronization

on:
  push:
    branches:
      - agent/issue-21-logging-hierarchy-design
    paths:
      - .github/workflows/issue-21-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout CodexSkill
        uses: actions/checkout@v5
        with:
          repository: ssaattww/CodexSkill
          path: .codex

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install document tooling
        run: npm ci

      - name: Synchronize design contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("doc/issue-21-hierarchical-logging-design.md")
          text = path.read_text(encoding="utf-8")
          old = """ネスト経路の lifecycle logger は次の優先順位で解決する。

          1. ルート workflow が `StepContext` に登録した engine 内部 logging context の engine logger。
          2. logging context がない standalone 実行では `StepContext.Logger`。

          内部 logging context は engine assembly 内部型として保持し、公開 API には追加しない。"""
          new = """ネスト経路の lifecycle logger には `StepContext.Logger` を使用する。root workflow から呼び出された場合は外側の Entry と Step の scope chain を継承し、standalone `Execute` / `ExecuteAsync` でも同じ logger 契約を維持する。

          nested Composite と simple execution の lifecycle category は `Devo6.WorkFlow.Step` とし、root workflow の Entry、retry、timeout、branch 制御は `Devo6.WorkFlow.Engine` を維持する。内部 logging context や公開 API は追加しない。"""
          if text.count(old) != 1:
              raise RuntimeError(f"nested logger contract: expected one old block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Markdown lint
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/markdown
          npm run lint:md 2>&1 | tee artifacts/markdown/lint-md.log

      - name: Diff check
        run: git diff --check

      - name: Upload document evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-21-markdown-evidence-${{ github.run_attempt }}
          path: artifacts/markdown
          if-no-files-found: warn
          retention-days: 14

      - name: Commit synchronized documentation
        run: |
          rm .github/workflows/issue-21-doc-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize Issue 21 logging contract"
          git push origin HEAD:${GITHUB_REF_NAME}
