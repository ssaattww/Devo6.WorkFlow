name: Issue 20 one-shot implementation

on:
  push:
    branches:
      - agent/issue-20-dotnet-script-compatibility-design

permissions:
  contents: write

concurrency:
  group: issue-20-one-shot
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

