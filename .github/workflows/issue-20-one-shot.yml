      - name: Checkout implementation branch
        uses: actions/checkout@v5
        with:
          ref: agent/issue-20-dotnet-script-compatibility-design
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

