name: Issue 20 implementation push

on:
  push:
    branches:
      - agent/issue-20-dotnet-script-compatibility-design

permissions:
  contents: write

concurrency:
  group: issue-20-implementation-push
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-20-dotnet-script-compatibility-design
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply prepared implementation patch
        shell: bash
        run: |
          python3 <<'EXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-20-implementation-apply.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = lines.index("          python3 <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ) + '\n'
          script = script.replace('if count != 1:', 'if count < 1:')
          Path('/tmp/issue20-apply.py').write_text(script, encoding='utf-8')
          EXTRACT

          python3 /tmp/issue20-apply.py 2> >(tee /tmp/issue20-apply-error.log >&2)

          python3 <<'TERMS'
          from pathlib import Path

          path = Path('tools/lint/markdown-whitelist.yaml')
          text = path.read_text(encoding='utf-8')
          if '  - term: cache\n' not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '  - term: cache\n    description: 依存復元結果を再利用する保存位置を表す実装語。\n'
              path.write_text(text, encoding='utf-8')
          TERMS

      - name: Restore dependencies
        run: |
          npm ci
          dotnet restore Devo6.WorkFlow.sln

      - name: Run focused issue 20 tests
        run: dotnet test tests/Devo6.WorkFlow.Tests/Devo6.WorkFlow.Tests.csproj --no-restore --filter FullyQualifiedName~Issue20DotnetScriptCompatibilityTests

      - name: Run solution tests
        run: dotnet test Devo6.WorkFlow.sln --configuration Release --no-restore --verbosity minimal

      - name: Format and verify
        run: |
          dotnet format Devo6.WorkFlow.sln --no-restore
          dotnet format Devo6.WorkFlow.sln --verify-no-changes --no-restore

      - name: Run Markdown checks
        run: |
          npm run lint:md
          npm run lint:md:terms

      - name: Verify diff
        run: git diff --check

      - name: Rewrite branch as granular verified commits
        env:
          BRANCH: agent/issue-20-dotnet-script-compatibility-design
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master "$BRANCH"
          git checkout -B "$BRANCH"
          git reset --soft origin/master
          git reset
          rm -f .github/workflows/issue-20-implementation-apply.yml
          rm -f .github/workflows/issue-20-implementation-push.yml
          rm -f reports/issue-20-automation-failure.md

          git add doc/issue-20-dotnet-script-compatibility-design.md
          git commit -m "docs: add issue 20 dotnet-script compatibility design"
          git push --force origin "HEAD:$BRANCH"

          git add reports/issue-20-dotnet-script-compatibility-design-review-20260718152000.md
          git commit -m "docs: record issue 20 design review"
          git push origin "HEAD:$BRANCH"

          git add tests/Devo6.WorkFlow.Tests/Issue20DotnetScriptCompatibilityTests.cs
          git commit -m "test: cover dotnet-script compatibility contracts"
          git push origin "HEAD:$BRANCH"

          git add src/Devo6.WorkFlow.Engine/CsxEntryLoader.cs
          git commit -m "fix: align csx diagnostics and NuGet cache behavior"
          git push origin "HEAD:$BRANCH"

          git add README.md
          git add doc/workflow_engine_spec.md
          git add samples/multi-folder-composite/README.md
          git add samples/multi-folder-composite/omnisharp.json
          git add tools/lint/markdown-whitelist.yaml
          git commit -m "docs: add OmniSharp restore and completion guidance"
          git push origin "HEAD:$BRANCH"

          git add tasks-status.md
          git add phases-status.md
          git add reports/issue-20-implementation-20260718170000.md
          git commit -m "chore: record issue 20 implementation and verification"
          git push origin "HEAD:$BRANCH"

          test -z "$(git status --porcelain)"

      - name: Record automation failure
        if: failure()
        env:
          BRANCH: agent/issue-20-dotnet-script-compatibility-design
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ERROR_DETAIL=""
          if [ -f /tmp/issue20-apply-error.log ]; then
            ERROR_DETAIL=$(cat /tmp/issue20-apply-error.log)
          fi
          git reset --hard HEAD
          cat > reports/issue-20-automation-failure.md <<EOF
          # 課題 #20 自動実装失敗記録

          GitHub Actions の実装・検証ジョブが失敗した。

          - workflow: ${GITHUB_WORKFLOW}
          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - commit: ${GITHUB_SHA}

          ## 適用エラー

          \`\`\`text
          ${ERROR_DETAIL}
          \`\`\`

          実装差分は branch へ反映していない。失敗 step のログを確認し、修正後に再実行する。
          EOF
          git add reports/issue-20-automation-failure.md
          git commit -m "chore: record issue 20 automation failure" || true
          git push origin "HEAD:$BRANCH" || true
