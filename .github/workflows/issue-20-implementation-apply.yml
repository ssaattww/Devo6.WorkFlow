          Path("reports/issue-20-implementation-20260718170000.md").write_text('''# 課題 #20 dotnet-script 互換実装報告

## 対象

- nullable 関連診断の `dotnet-script` 2.0.1 互換化
- NuGet 復元 cache path の標準化と公開 option 伝達
- OmniSharp の script NuGet 補完設定と利用手順
- 利用者目線の回帰検査、設計同期、進捗同期

## 実装

- `CS8600` から `CS8655` を `ReportDiagnostic.Error` として適用する共通診断 helper を追加した。
- `Execute` と `Validate` は同じ helper から compile error を取得する。
- 対象外の通常 warning は従来どおり実行を妨げない。
- `CsxEntryLoaderOptions.DotnetScriptCachePath` と `CsxNuGetDependencyGraphRequest.DotnetScriptCachePath` を追加した。
- 未指定 cache path は空文字列として Dotnet.Script の既存標準解決規則へ渡し、明示値は実行と依存解決の両方へ伝達する。
- サンプルへ `omnisharp.json` を追加し、`engine validate` 後の言語サービス再読み込み手順を README に記録した。

## 検査

GitHub Actions の .NET 8 / Node.js 22 環境で次を実行してから、論理単位の commit を作成した。

- `dotnet test tests/Devo6.WorkFlow.Tests/Devo6.WorkFlow.Tests.csproj --filter FullyQualifiedName~Issue20DotnetScriptCompatibilityTests`
- `dotnet test Devo6.WorkFlow.sln --configuration Release --no-restore`
- `dotnet format Devo6.WorkFlow.sln --no-restore`
- `dotnet format Devo6.WorkFlow.sln --verify-no-changes --no-restore`
- `npm run lint:md`
- `npm run lint:md:terms`
- `git diff --check`

すべて成功した場合だけ PR branch を更新する。

## リスク

- 実際のエディタ補完は OmniSharp または利用中の C# 言語サービスを含むため、通常の xUnit では JSON 設定と復元境界までを自動検査する。
- `Dotnet.Script.Core` の版を更新する場合は、nullable 診断範囲を再確認する。
