name: Issue 20 verified implementation

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: issue-20-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/issue-20-dotnet-script-compatibility-design'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation and documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:120]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, addition: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if marker in text:
                  return
              if not text.endswith("\n"):
                  text += "\n"
              file_path.write_text(text + addition, encoding="utf-8")

          engine_path = "src/Devo6.WorkFlow.Engine/CsxEntryLoader.cs"

          replace_once(
              engine_path,
              "using Microsoft.CodeAnalysis;\nusing Microsoft.CodeAnalysis.CSharp.Scripting;",
              "using Microsoft.CodeAnalysis;\nusing Microsoft.CodeAnalysis.CSharp;\nusing Microsoft.CodeAnalysis.CSharp.Scripting;")

          replace_once(
              engine_path,
              "    private static readonly ICsxNuGetDependencyGraphProvider DefaultNuGetDependencyGraphProvider = new DotnetScriptCsxNuGetDependencyGraphProvider();\n    private static readonly IDeserializer NuGetLockDeserializer = new DeserializerBuilder()",
              "    private static readonly ICsxNuGetDependencyGraphProvider DefaultNuGetDependencyGraphProvider = new DotnetScriptCsxNuGetDependencyGraphProvider();\n    private static readonly ImmutableDictionary<string, ReportDiagnostic> DotnetScriptDiagnosticOptions = Enumerable\n        .Range(8600, 56)\n        .ToImmutableDictionary(\n            number => $\"CS{number}\",\n            _ => ReportDiagnostic.Error);\n    private static readonly IDeserializer NuGetLockDeserializer = new DeserializerBuilder()")

          replace_once(
              engine_path,
              "            ImmutableArray<Diagnostic> errors = script.Compile()\n                .Where(diagnostic => diagnostic.Severity == DiagnosticSeverity.Error)\n                .ToImmutableArray();",
              "            ImmutableArray<Diagnostic> errors = GetCompileErrors(script);")

          replace_once(
              engine_path,
              "            ImmutableArray<Diagnostic> compileErrors = script.Compile()\n                .Where(diagnostic => diagnostic.Severity == DiagnosticSeverity.Error)\n                .ToImmutableArray();",
              "            ImmutableArray<Diagnostic> compileErrors = GetCompileErrors(script);")

          replace_once(
              engine_path,
              "    /// <summary>\n    /// Roslyn script 実行に使う参照と import を組み立てます。\n    /// </summary>\n    /// <param name=\"entryPath\">entry script の path。</param>\n    /// <param name=\"source\">読み込み済み script source。</param>\n    /// <returns>script compile と実行に使う option。</returns>\n    private static ScriptOptions CreateScriptOptions(string entryPath, CsxScriptSource source)",
              "    /// <summary>\n    /// Dotnet.Script.Core 2.0.1 と同じ nullable 診断を error へ昇格し、compile error を取得します。\n    /// </summary>\n    /// <param name=\"script\">診断対象の Roslyn script。</param>\n    /// <returns>error として扱う compile 診断。</returns>\n    private static ImmutableArray<Diagnostic> GetCompileErrors(Microsoft.CodeAnalysis.Scripting.Script<object> script)\n    {\n        CSharpCompilation compilation = (CSharpCompilation)script.GetCompilation();\n        CSharpCompilationOptions options = compilation.Options\n            .WithSpecificDiagnosticOptions(DotnetScriptDiagnosticOptions);\n\n        return compilation\n            .WithOptions(options)\n            .GetDiagnostics()\n            .Where(diagnostic => diagnostic.Severity == DiagnosticSeverity.Error)\n            .ToImmutableArray();\n    }\n\n    /// <summary>\n    /// Roslyn script 実行に使う参照と import を組み立てます。\n    /// </summary>\n    /// <param name=\"entryPath\">entry script の path。</param>\n    /// <param name=\"source\">読み込み済み script source。</param>\n    /// <returns>script compile と実行に使う option。</returns>\n    private ScriptOptions CreateScriptOptions(string entryPath, CsxScriptSource source)")

          replace_once(
              engine_path,
              "        var compiler = new ScriptCompiler(logFactory, workingDirectory, true);",
              "        var compiler = new ScriptCompiler(logFactory, loaderOptions.DotnetScriptCachePath ?? \"\", true);")

          replace_once(
              engine_path,
              "                new CsxNuGetDependencyGraphRequest(entryPath, context.WorkflowRoot, lockPath, sourceCode));",
              "                new CsxNuGetDependencyGraphRequest(entryPath, context.WorkflowRoot, lockPath, sourceCode)\n                {\n                    DotnetScriptCachePath = loaderOptions.DotnetScriptCachePath,\n                });")

          replace_once(
              engine_path,
              "            var compiler = new ScriptCompiler(logFactory, workingDirectory, true);",
              "            var compiler = new ScriptCompiler(logFactory, request.DotnetScriptCachePath ?? \"\", true);")

          replace_once(
              engine_path,
              "    /// <summary>\n    /// NuGet dependency graph を解決する provider を取得または設定します。null の場合は Dotnet.Script の既定 provider を使います。\n    /// </summary>\n    public ICsxNuGetDependencyGraphProvider? NuGetDependencyGraphProvider { get; init; }",
              "    /// <summary>\n    /// Dotnet.Script の依存復元に使う cache path を取得または設定します。null の場合は Dotnet.Script の標準位置を使います。\n    /// </summary>\n    public string? DotnetScriptCachePath { get; init; }\n\n    /// <summary>\n    /// NuGet dependency graph を解決する provider を取得または設定します。null の場合は Dotnet.Script の既定 provider を使います。\n    /// </summary>\n    public ICsxNuGetDependencyGraphProvider? NuGetDependencyGraphProvider { get; init; }")

          replace_once(
              engine_path,
              "    /// <summary>\n    /// NuGet directive を含む script source を取得します。\n    /// </summary>\n    public string SourceCode { get; }\n}",
              "    /// <summary>\n    /// NuGet directive を含む script source を取得します。\n    /// </summary>\n    public string SourceCode { get; }\n\n    /// <summary>\n    /// Dotnet.Script の依存復元に使う cache path を取得または設定します。null の場合は標準位置を使います。\n    /// </summary>\n    public string? DotnetScriptCachePath { get; init; }\n}")

          test_path = Path("tests/Devo6.WorkFlow.Tests/Issue20DotnetScriptCompatibilityTests.cs")
          test_path.write_text(r'''using Devo6.WorkFlow.Abstractions;
using Devo6.WorkFlow.Engine;
using System.Text.Json;

namespace Devo6.WorkFlow.Tests;

/// <summary>
/// 課題 #20 の dotnet-script 診断、cache path、エディタ設定の互換契約を検査します。
/// </summary>
public sealed class Issue20DotnetScriptCompatibilityTests
{
    /// <summary>
    /// nullable directive がない script で nullable annotation が発生した場合に実行を拒否することを検査します。
    /// </summary>
    [Fact(DisplayName = "nullable directive なしの nullable annotation は Execute で compile error になる")]
    public void ExecuteRejectsNullableDiagnosticWithoutNullableDirective()
    {
        string scriptPath = CreateScript(CreateWorkflowScript(enableNullable: false, useNullableAnnotation: true));

        WorkflowResult result = new CsxEntryLoader().Execute(scriptPath);

        Assert.False(result.Succeeded);
        Assert.Equal(WorkflowErrorCodes.ScriptCompileFailed, result.ErrorCode);
        Assert.Contains("CS8632", result.ErrorMessage, StringComparison.Ordinal);
    }

    /// <summary>
    /// nullable directive がない script で nullable annotation が発生した場合に検証を拒否することを検査します。
    /// </summary>
    [Fact(DisplayName = "nullable directive なしの nullable annotation は Validate で compile error になる")]
    public void ValidateRejectsNullableDiagnosticWithoutNullableDirective()
    {
        string scriptPath = CreateScript(CreateWorkflowScript(enableNullable: false, useNullableAnnotation: true));

        WorkflowValidationResult result = new CsxEntryLoader().Validate(scriptPath);

        ValidationError error = Assert.Single(result.Errors);
        Assert.False(result.Succeeded);
        Assert.Equal(WorkflowErrorCodes.ScriptCompileFailed, error.Code);
        Assert.Contains("CS8632", error.Message, StringComparison.Ordinal);
    }

    /// <summary>
    /// nullable directive を有効にした同等 script は実行できることを検査します。
    /// </summary>
    [Fact(DisplayName = "nullable directive を有効にした nullable annotation は実行できる")]
    public void ExecuteAcceptsNullableAnnotationWithNullableDirective()
    {
        string scriptPath = CreateScript(CreateWorkflowScript(enableNullable: true, useNullableAnnotation: true));

        WorkflowResult result = new CsxEntryLoader().Execute(scriptPath);

        Assert.True(result.Succeeded, result.ErrorMessage);
        Assert.Equal("Main", result.EntryName);
    }

    /// <summary>
    /// nullable 範囲外の通常 warning だけでは実行を拒否しないことを検査します。
    /// </summary>
    [Fact(DisplayName = "nullable 範囲外の通常 warning は compile error に昇格しない")]
    public void ExecuteKeepsOrdinaryWarningsNonBlocking()
    {
        string scriptPath = CreateScript(CreateWorkflowScript(
            enableNullable: false,
            useNullableAnnotation: false,
            includeOrdinaryWarning: true));

        WorkflowResult result = new CsxEntryLoader().Execute(scriptPath);

        Assert.True(result.Succeeded, result.ErrorMessage);
    }

    /// <summary>
    /// 明示 cache path が Execute と Validate の依存解決 request に伝達されることを検査します。
    /// </summary>
    [Fact(DisplayName = "明示 DotnetScriptCachePath は Execute と Validate の provider request に伝達される")]
    public void ExplicitCachePathIsPropagatedToExecuteAndValidateProviderRequests()
    {
        string scriptPath = CreateScript(CreateNuGetWorkflowScript());
        string cachePath = Path.Combine(Path.GetDirectoryName(scriptPath)!, "custom-cache");
        var provider = new CapturingNuGetDependencyGraphProvider();
        var loader = new CsxEntryLoader(new CsxEntryLoaderOptions
        {
            DotnetScriptCachePath = cachePath,
            NuGetDependencyGraphProvider = provider,
        });

        WorkflowValidationResult validationResult = loader.Validate(scriptPath);
        WorkflowResult executionResult = loader.Execute(scriptPath);

        Assert.True(validationResult.Succeeded, string.Join(Environment.NewLine, validationResult.Errors.Select(error => error.Message)));
        Assert.True(executionResult.Succeeded, executionResult.ErrorMessage);
        Assert.Equal(2, provider.ResolveCallCount);
        Assert.All(provider.Requests, request => Assert.Equal(cachePath, request.DotnetScriptCachePath));
    }

    /// <summary>
    /// cache path 未指定時に provider request へ null が伝達されることを検査します。
    /// </summary>
    [Fact(DisplayName = "未指定 DotnetScriptCachePath は provider request で null を維持する")]
    public void DefaultCachePathRemainsNullInProviderRequest()
    {
        string scriptPath = CreateScript(CreateNuGetWorkflowScript());
        var provider = new CapturingNuGetDependencyGraphProvider();
        var loader = new CsxEntryLoader(new CsxEntryLoaderOptions
        {
            NuGetDependencyGraphProvider = provider,
        });

        WorkflowValidationResult result = loader.Validate(scriptPath);

        Assert.True(result.Succeeded, string.Join(Environment.NewLine, result.Errors.Select(error => error.Message)));
        CsxNuGetDependencyGraphRequest request = Assert.Single(provider.Requests);
        Assert.Null(request.DotnetScriptCachePath);
    }

    /// <summary>
    /// 利用者向けサンプルが OmniSharp の script NuGet 参照を有効にすることを検査します。
    /// </summary>
    [Fact(DisplayName = "複数フォルダサンプルは OmniSharp の script NuGet 参照を有効にする")]
    public void SampleOmniSharpConfigurationEnablesScriptNuGetReferences()
    {
        string configurationPath = Path.Combine(
            FindRepositoryRoot(),
            "samples",
            "multi-folder-composite",
            "omnisharp.json");

        Assert.True(File.Exists(configurationPath));
        using JsonDocument document = JsonDocument.Parse(File.ReadAllText(configurationPath));
        JsonElement script = document.RootElement.GetProperty("script");
        Assert.True(script.GetProperty("enableScriptNuGetReferences").GetBoolean());
        Assert.Equal("net8.0", script.GetProperty("defaultTargetFramework").GetString());
    }

    /// <summary>
    /// nullable 設定と通常 warning の有無を切り替えた最小 workflow script を作成します。
    /// </summary>
    /// <param name="enableNullable">nullable directive を有効にする場合は true。</param>
    /// <param name="useNullableAnnotation">nullable annotation を使う場合は true。</param>
    /// <param name="includeOrdinaryWarning">通常 warning を発生させる場合は true。</param>
    /// <returns>最小 workflow script。</returns>
    private static string CreateWorkflowScript(
        bool enableNullable,
        bool useNullableAnnotation,
        bool includeOrdinaryWarning = false)
    {
        string nullableDirective = enableNullable ? "#nullable enable" : "";
        string outputType = useNullableAnnotation ? "string?" : "string";
        string warningStatement = includeOrdinaryWarning ? "int unused = 1;" : "";

        return $$"""
            {{nullableDirective}}
            using Devo6.WorkFlow.Abstractions;
            using Devo6.WorkFlow.Engine;

            public sealed class MainStep : IStep<{{outputType}}>
            {
                public {{outputType}} Execute(StepInput input)
                {
                    {{warningStatement}}
                    return "ok";
                }
            }

            var Main = CompositeStep.Define("Main")
                .Run<MainStep, {{outputType}}>()
                    .StoreAs();
            """;
    }

    /// <summary>
    /// 固定版 NuGet 参照を含む最小 workflow script を作成します。
    /// </summary>
    /// <returns>NuGet 参照付き workflow script。</returns>
    private static string CreateNuGetWorkflowScript()
    {
        return """
            #r "nuget: Example.Package, 1.0.0"
            using Devo6.WorkFlow.Abstractions;
            using Devo6.WorkFlow.Engine;

            public sealed class MainStep : IStep<string>
            {
                public string Execute(StepInput input) => "ok";
            }

            var Main = CompositeStep.Define("Main")
                .Run<MainStep, string>()
                    .StoreAs();
            """;
    }

    /// <summary>
    /// 一時 directory に main.csx を作成します。
    /// </summary>
    /// <param name="contents">script 本文。</param>
    /// <returns>作成した main.csx path。</returns>
    private static string CreateScript(string contents)
    {
        string directory = Path.Combine(
            Path.GetTempPath(),
            "devo6-workflow-issue20-tests",
            Guid.NewGuid().ToString("N"));
        Directory.CreateDirectory(directory);
        string scriptPath = Path.Combine(directory, "main.csx");
        File.WriteAllText(scriptPath, contents);

        return scriptPath;
    }

    /// <summary>
    /// solution file を持つリポジトリルートを探索します。
    /// </summary>
    /// <returns>リポジトリルートの完全 path。</returns>
    private static string FindRepositoryRoot()
    {
        DirectoryInfo? directory = new(AppContext.BaseDirectory);
        while (directory is not null)
        {
            if (File.Exists(Path.Combine(directory.FullName, "Devo6.WorkFlow.sln")))
            {
                return directory.FullName;
            }

            directory = directory.Parent;
        }

        throw new DirectoryNotFoundException("Repository root was not found.");
    }

    /// <summary>
    /// provider request を記録し、外部通信なしで固定 dependency graph を返します。
    /// </summary>
    private sealed class CapturingNuGetDependencyGraphProvider : ICsxNuGetDependencyGraphProvider
    {
        /// <summary>
        /// 記録した provider request を取得します。
        /// </summary>
        public List<CsxNuGetDependencyGraphRequest> Requests { get; } = [];

        /// <summary>
        /// Resolve 呼び出し回数を取得します。
        /// </summary>
        public int ResolveCallCount => Requests.Count;

        /// <summary>
        /// request を記録し、固定 dependency graph を返します。
        /// </summary>
        /// <param name="directReferences">script から読んだ直接参照。</param>
        /// <param name="request">dependency graph request。</param>
        /// <returns>固定 dependency graph。</returns>
        public CsxNuGetDependencyGraph Resolve(
            IReadOnlyList<CsxNuGetReference> directReferences,
            CsxNuGetDependencyGraphRequest request)
        {
            Requests.Add(request);

            return new CsxNuGetDependencyGraph(
                [new CsxResolvedNuGetDependency("Example.Package", "1.0.0", isDirect: true)]);
        }
    }
}
