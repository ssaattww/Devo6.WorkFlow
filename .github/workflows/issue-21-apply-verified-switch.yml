name: Apply verified Issue 21 Switch fix

on:
  push:
    branches:
      - agent/issue-21-logging-hierarchy-design
    paths:
      - .github/workflows/issue-21-apply-verified-switch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Devo6.WorkFlow.sln

      - name: Apply verified fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Devo6.WorkFlow.Engine/CompositeStep.cs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'throw new InvalidOperationException($"Switch case \'{value}\' is already registered.");',
                  'throw new InvalidOperationException("Switch case is already registered.");',
              ),
              (
                  'EnsureCaseHasSteps(built, $"case \'{value}\'");',
                  'EnsureCaseHasSteps(built, "case");',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"verified Switch replacement: expected one match, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format
        run: dotnet format Devo6.WorkFlow.sln --no-restore

      - name: Focused verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          dotnet test tests/Devo6.WorkFlow.Tests/Devo6.WorkFlow.Tests.csproj \
            --no-restore \
            --filter "FullyQualifiedName~SwitchBranchLoggingSafetyTests|FullyQualifiedName~SwitchBranchContractTests|FullyQualifiedName~CodingStandardsContractTests" \
            --logger "trx;LogFileName=switch-safety.trx" \
            --results-directory TestResults \
            2>&1 | tee TestResults/switch-safety.log

      - name: Diff check
        run: git diff --check

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-21-applied-switch-fix-${{ github.run_attempt }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/issue-21-apply-verified-switch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: avoid unsafe Switch case value formatting"
          git push origin HEAD:${GITHUB_REF_NAME}
