name: Issue 21 implementation and evidence

on:
  push:
    branches:
      - agent/issue-21-logging-hierarchy-design
    paths:
      - .github/workflows/issue-21-apply.yml
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Devo6.WorkFlow.sln

      - name: Apply coding standards fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-results
          python3 - <<'PY' 2>&1 | tee artifacts/test-results/apply-standards.log
          from pathlib import Path

          provider_path = Path("src/Devo6.WorkFlow.Cli/EngineLoggingProvider.cs")
          provider = provider_path.read_text(encoding="utf-8")
          old_provider = "internal sealed record EngineLoggingOptions"
          new_provider = "internal sealed class EngineLoggingOptions"
          if old_provider in provider:
              provider = provider.replace(old_provider, new_provider, 1)
          elif new_provider not in provider:
              raise RuntimeError("EngineLoggingOptions declaration was not found")
          provider_path.write_text(provider, encoding="utf-8")

          engine_path = Path("src/Devo6.WorkFlow.Engine/CompositeStep.cs")
          engine = engine_path.read_text(encoding="utf-8")
          old_engine = "\n".join([
              "            object? boxedValue = value;",
              "            displayValue = boxedValue switch",
              "            {",
              "                null => \"null\",",
              "                IFormattable formattable => formattable.ToString(null, CultureInfo.InvariantCulture) ?? \"null\",",
              "                _ => boxedValue.ToString() ?? \"null\",",
              "            };",
          ])
          new_engine = "\n".join([
              "            object? boxedValue = value;",
              "            if (boxedValue is null)",
              "            {",
              "                displayValue = \"null\";",
              "            }",
              "            else if (boxedValue is IFormattable)",
              "            {",
              "                displayValue = ((IFormattable)boxedValue).ToString(null, CultureInfo.InvariantCulture) ?? \"null\";",
              "            }",
              "            else",
              "            {",
              "                displayValue = boxedValue.ToString() ?? \"null\";",
              "            }",
          ])
          if old_engine in engine:
              engine = engine.replace(old_engine, new_engine, 1)
          elif new_engine not in engine:
              raise RuntimeError("Switch branch formatter block was not found")
          engine_path.write_text(engine, encoding="utf-8")
          PY

      - name: Format
        run: dotnet format Devo6.WorkFlow.sln --no-restore

      - name: Verify standards and logging
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Devo6.WorkFlow.Tests/Devo6.WorkFlow.Tests.csproj \
            --no-restore \
            --filter "FullyQualifiedName~CodingStandardsContractTests|FullyQualifiedName~HierarchicalLoggingContractTests|FullyQualifiedName~EngineLoggingHierarchyTests|FullyQualifiedName~WorkflowResultContractTests|FullyQualifiedName~RetryExecutionContractTests|FullyQualifiedName~IfBranchContractTests|FullyQualifiedName~SwitchBranchContractTests" \
            --logger "trx;LogFileName=issue-21-standards.trx" \
            --results-directory artifacts/test-results \
            2>&1 | tee artifacts/test-results/issue-21-standards.log

      - name: Diff check
        run: git diff --check

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-21-standards-evidence-${{ github.run_attempt }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet -- src/Devo6.WorkFlow.Cli/EngineLoggingProvider.cs src/Devo6.WorkFlow.Engine/CompositeStep.cs; then
            echo "No standards changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Devo6.WorkFlow.Cli/EngineLoggingProvider.cs src/Devo6.WorkFlow.Engine/CompositeStep.cs
          git commit -m "fix: align hierarchical logging with coding standards"
          git push origin HEAD:"${TARGET_BRANCH}"
