name: Issue 21 Switch display safety fix

on:
  push:
    branches:
      - agent/issue-21-logging-hierarchy-design
    paths:
      - .github/workflows/issue-21-switch-safety-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Devo6.WorkFlow.sln

      - name: Apply safe case display fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Devo6.WorkFlow.Engine/CompositeStep.cs")
          text = path.read_text(encoding="utf-8")
          old_case = """        ArgumentNullException.ThrowIfNull(branch);
          if (cases.Any(switchCase => EqualityComparer<TCase>.Default.Equals(switchCase.Value, value)))
          {
              throw new InvalidOperationException($"Switch case '{value}' is already registered.");
          }

          BranchBuilder<TOut> built = branch(new BranchBuilder<TIn>());
          EnsureCaseHasSteps(built, $"case '{value}'");
          """
          new_case = """        ArgumentNullException.ThrowIfNull(branch);
          string caseDisplayValue = FormatCaseDisplayValue(value);
          if (cases.Any(switchCase => EqualityComparer<TCase>.Default.Equals(switchCase.Value, value)))
          {
              throw new InvalidOperationException($"Switch case '{caseDisplayValue}' is already registered.");
          }

          BranchBuilder<TOut> built = branch(new BranchBuilder<TIn>());
          EnsureCaseHasSteps(built, $"case '{caseDisplayValue}'");
          """
          if text.count(old_case) != 1:
              raise RuntimeError(f"Switch Case block: expected one match, found {text.count(old_case)}")
          text = text.replace(old_case, new_case, 1)

          marker = """    /// <summary>
          /// case または default branch が少なくとも 1 つの実行単位を持つことを確認します。
          """
          helper = """    /// <summary>
          /// case 値を例外 message とログで安全に使える表示文字列へ変換します。
          /// </summary>
          /// <param name="value">表示する case 値。</param>
          /// <returns>制御文字を除去して 128 文字へ制限した表示文字列。</returns>
          private static string FormatCaseDisplayValue(TCase value)
          {
              string displayValue;
              try
              {
                  object? boxedValue = value;
                  if (boxedValue is null)
                  {
                      displayValue = "null";
                  }
                  else if (boxedValue is IFormattable)
                  {
                      displayValue = ((IFormattable)boxedValue).ToString(null, CultureInfo.InvariantCulture) ?? "null";
                  }
                  else
                  {
                      displayValue = boxedValue.ToString() ?? "null";
                  }
              }
              catch
              {
                  displayValue = "<unavailable>";
              }

              char[] characters = displayValue
                  .Select(character => char.IsControl(character) ? ' ' : character)
                  .Take(128)
                  .ToArray();

              return new string(characters);
          }

          """
          if text.count(marker) != 1:
              raise RuntimeError(f"Switch helper marker: expected one match, found {text.count(marker)}")
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format
        run: dotnet format Devo6.WorkFlow.sln --no-restore

      - name: Verify Switch display safety
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/test-results
          dotnet test tests/Devo6.WorkFlow.Tests/Devo6.WorkFlow.Tests.csproj \
            --no-restore \
            --filter "FullyQualifiedName~SwitchBranchLoggingSafetyTests|FullyQualifiedName~SwitchBranchContractTests|FullyQualifiedName~CodingStandardsContractTests" \
            --logger "trx;LogFileName=switch-display-safety.trx" \
            --results-directory artifacts/test-results \
            2>&1 | tee artifacts/test-results/switch-display-safety.log

      - name: Diff check
        run: git diff --check

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-21-switch-safety-evidence-${{ github.run_attempt }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/issue-21-switch-safety-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make Switch case display formatting safe"
          git push origin HEAD:${GITHUB_REF_NAME}
