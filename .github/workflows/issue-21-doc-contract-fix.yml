name: Issue 21 design contract alignment

on:
  push:
    branches:
      - agent/issue-21-logging-hierarchy-design
    paths:
      - .github/workflows/issue-21-doc-contract-fix.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Align design with implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("doc/issue-21-hierarchical-logging-design.md")
          text = path.read_text(encoding="utf-8")
          old = "\n".join([
              "ネスト経路の lifecycle logger は次の優先順位で解決する。",
              "",
              "1. ルート workflow が `StepContext` に登録した engine 内部 logging context の engine logger。",
              "2. logging context がない standalone 実行では `StepContext.Logger`。",
              "",
              "内部 logging context は engine assembly 内部型として保持し、公開 API には追加しない。",
          ])
          new = "\n".join([
              "ネスト経路の lifecycle logger には `StepContext.Logger` を使用する。root workflow から呼び出された場合は外側の Entry と Step の scope chain を継承し、standalone `Execute` / `ExecuteAsync` でも同じ logger 契約を維持する。",
              "",
              "nested Composite と simple execution の lifecycle category は `Devo6.WorkFlow.Step` とし、root workflow の Entry、retry、timeout、branch 制御は `Devo6.WorkFlow.Engine` を維持する。内部 logging context や公開 API は追加しない。",
          ])
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"nested logger contract: expected one match, found {count}")
          text = text.replace(old, new, 1)
          if old in text or new not in text:
              raise RuntimeError("nested logger contract replacement was not applied")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Diff check
        run: git diff --check

      - name: Commit alignment and remove workflow
        run: |
          rm .github/workflows/issue-21-doc-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: align Issue 21 design with implementation"
          git push origin HEAD:${GITHUB_REF_NAME}
