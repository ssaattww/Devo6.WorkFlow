name: Publish NuGet Package

on:
  release:
    types:
      - published
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      package_version:
        description: "Package version override"
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Resolve package projects
        id: projects
        shell: bash
        run: |
          cli_project="src/Devo6.WorkFlow.Cli/Devo6.WorkFlow.Cli.csproj"
          engine_project="src/Devo6.WorkFlow.Engine/Devo6.WorkFlow.Engine.csproj"

          if [[ ! -f "$cli_project" ]]; then
            echo "CLI publish project not found: $cli_project"
            exit 1
          fi

          if [[ ! -f "$engine_project" ]]; then
            echo "Engine publish project not found: $engine_project"
            exit 1
          fi

          echo "cli_path=$cli_project" >> "$GITHUB_OUTPUT"
          echo "engine_path=$engine_project" >> "$GITHUB_OUTPUT"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          project="${{ steps.projects.outputs.cli_path }}"
          manual_version="${{ github.event.inputs.package_version }}"
          event_name="${{ github.event_name }}"
          ref_name="${{ github.ref_name }}"
          release_tag="${{ github.event.release.tag_name }}"
          release_is_prerelease="${{ github.event.release.prerelease }}"

          if [[ -n "$manual_version" ]]; then
            package_version="$manual_version"
          elif [[ "$event_name" == "release" ]]; then
            base_version="${release_tag#v}"
            if [[ "$release_is_prerelease" == "true" ]]; then
              if [[ "$base_version" == *-* ]]; then
                package_version="$base_version"
              else
                package_version="${base_version}-pre"
              fi
            else
              if [[ "$base_version" == *-* ]]; then
                echo "Release is not pre-release, but tag contains pre-release suffix: $release_tag"
                exit 1
              fi
              package_version="$base_version"
            fi
          elif [[ "$event_name" == "push" && "$ref_name" == "master" ]]; then
            version_prefix=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' "$project" || true)
            if [[ -z "$version_prefix" ]]; then
              version_prefix="0.1.0"
            fi

            latest_stable_tag=$(git tag --sort=-v:refname | grep -E '^(v)?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            if [[ -n "$latest_stable_tag" ]]; then
              base_version="${latest_stable_tag#v}"
              commits_since_base=$(git rev-list --count "${latest_stable_tag}..HEAD")
            else
              base_version="$version_prefix"
              commits_since_base=$(git rev-list --count HEAD)
            fi

            if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid base version format: $base_version"
              exit 1
            fi

            IFS='.' read -r major minor patch <<< "$base_version"
            if [[ "$commits_since_base" -lt 1 ]]; then
              commits_since_base=1
            fi

            next_patch=$((patch + commits_since_base))
            package_version="${major}.${minor}.${next_patch}-pre"
          else
            version_prefix=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' "$project" || true)
            if [[ -z "$version_prefix" ]]; then
              version_prefix="0.1.0"
            fi
            package_version="${version_prefix}-ci.${GITHUB_RUN_NUMBER}"
          fi

          if [[ -z "$package_version" ]]; then
            echo "Failed to resolve package version."
            exit 1
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Devo6.WorkFlow.sln

      - name: Test
        run: dotnet test Devo6.WorkFlow.sln --configuration Release --no-restore

      - name: Pack CLI tool
        run: |
          dotnet pack "${{ steps.projects.outputs.cli_path }}" \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:ContinuousIntegrationBuild=true \
            -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Pack reference package
        run: |
          dotnet pack "${{ steps.projects.outputs.engine_path }}" \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:ContinuousIntegrationBuild=true \
            -p:BuildProjectReferences=false \
            -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Verify tool install
        shell: bash
        run: |
          toolpath=$(mktemp -d)
          dotnet tool install \
            --tool-path "$toolpath" \
            Devo6.WorkFlow.Cli \
            --add-source ./artifacts \
            --version "${{ steps.version.outputs.package_version }}"
          "$toolpath/engine"
          rm -rf "$toolpath"

      - name: Verify reference package install
        shell: bash
        run: |
          projectpath=$(mktemp -d)
          dotnet new classlib --framework net8.0 --output "$projectpath"
          dotnet add "$projectpath" package Devo6.WorkFlow.Engine \
            --source ./artifacts \
            --version "${{ steps.version.outputs.package_version }}"
          cat > "$projectpath/Class1.cs" <<'CS'
          using System;
          using Devo6.WorkFlow.Abstractions;
          using Devo6.WorkFlow.Engine;

          namespace PackageInstallCheck;

          public sealed class Class1
          {
              public Type EngineType { get; } = typeof(CompositeStep);

              public Type AbstractionsType { get; } = typeof(IStep<>);
          }
          CS
          dotnet build "$projectpath" --configuration Release
          rm -rf "$projectpath"

      - name: Validate NuGet API key
        if: ${{ env.NUGET_API_KEY == '' }}
        run: |
          echo "NUGET_API_KEY secret is not set."
          exit 1

      - name: Publish to NuGet.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ env.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Verify gh CLI
        if: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
        run: gh --version

      - name: Create GitHub Pre-release
        if: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          tag="${{ steps.version.outputs.package_version }}"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "GitHub pre-release already exists: $tag"
            exit 0
          fi

          notes_file=$(mktemp)
          {
            echo "Automated pre-release from master push."
            echo
            pr_numbers=$(gh api -H "Accept: application/vnd.github+json" "/repos/${repo}/commits/${sha}/pulls" --jq '.[].number' 2>/dev/null || true)
            if [[ -n "${pr_numbers}" ]]; then
              echo "Related pull requests:"
              while IFS= read -r pr; do
                [[ -z "${pr}" ]] && continue
                echo "- #${pr}"
              done <<< "${pr_numbers}"
            else
              echo "Related pull request: not found."
            fi
          } > "$notes_file"

          gh release create "$tag" \
            --repo "$repo" \
            --target "$sha" \
            --title "$tag" \
            --notes-file "$notes_file" \
            --prerelease
