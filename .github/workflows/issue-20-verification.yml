name: Issue 20 final verification

on:
  push:
    branches:
      - agent/issue-20-dotnet-script-compatibility-design

permissions:
  contents: read

concurrency:
  group: issue-20-final-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore
        run: dotnet restore Devo6.WorkFlow.sln

      - name: Test
        run: dotnet test Devo6.WorkFlow.sln --configuration Release --no-restore --verbosity minimal

      - name: Format
        run: dotnet format Devo6.WorkFlow.sln --verify-no-changes --no-restore

      - name: Install Markdown dependencies
        run: npm ci

      - name: Markdown lint
        run: npm run lint:md

      - name: Terminology check
        run: npm run lint:md:terms

      - name: Diff check
        run: git diff --check origin/master...HEAD
