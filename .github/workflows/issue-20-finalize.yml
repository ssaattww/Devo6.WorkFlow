          Path("reports/issue-20-implementation-20260718190000.md").write_text('''# 課題 #20 dotnet-script 互換実装報告

## 対象

- nullable 関連診断の Dotnet.Script.Core 2.0.1 互換化
- NuGet 復元 cache path の標準化と公開 option 伝達
- OmniSharp の script NuGet 補完設定と利用手順
- 利用者目線の回帰検査、既存 fixture、設計、進捗の同期

## 実装

- `CS8600` から `CS8655` を `ReportDiagnostic.Error` として適用する共通診断 helper を追加した。
- `Execute` と `Validate` は同じ helper から compile error を取得する。
- 対象外の通常 warning は従来どおり実行を妨げない。
- `CsxEntryLoaderOptions.DotnetScriptCachePath` と `CsxNuGetDependencyGraphRequest.DotnetScriptCachePath` を追加した。
- 未指定 cache path は空文字列へ変換して Dotnet.Script の標準解決規則へ渡し、明示値は実行と依存解決の両方へ伝達する。
- sample へ `omnisharp.json` と `#nullable enable` を追加し、`engine validate` 後の言語サービス再読み込み手順を文書化した。
- 新しい診断契約により失敗した既存 Config fixture 2 件へ `#nullable enable` を追加した。

## 検査

GitHub Actions の .NET 8 / Node.js 22 環境で次を実行した。

- `dotnet test tests/Devo6.WorkFlow.Tests/Devo6.WorkFlow.Tests.csproj --filter FullyQualifiedName~DotnetScriptCompatibilityTests`
- `dotnet test Devo6.WorkFlow.sln --configuration Release --no-restore`
- `dotnet format Devo6.WorkFlow.sln --no-restore`
- `dotnet format Devo6.WorkFlow.sln --verify-no-changes --no-restore`
- `npm run lint:md`
- `npm run lint:md:terms`
- `git diff --check`

すべての検査に成功した場合だけ、PR branch を細分化した commit 群へ更新する。

## リスク

- 実際のエディタ補完は OmniSharp または利用中の C# 言語サービスを含むため、通常の xUnit では JSON 設定と復元責務の境界までを自動検査する。
- Dotnet.Script.Core の版を更新する場合は、nullable 診断範囲を再確認する。
