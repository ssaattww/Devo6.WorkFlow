name: PR xUnit Tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pr-xunit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Devo6.WorkFlow.sln

      - name: Apply final Issue 21 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provider_path = Path("src/Devo6.WorkFlow.Cli/EngineLoggingProvider.cs")
          provider = provider_path.read_text(encoding="utf-8")
          provider = provider.replace(
              "internal sealed record EngineLoggingOptions",
              "internal sealed class EngineLoggingOptions",
              1,
          )
          provider_path.write_text(provider, encoding="utf-8")

          engine_path = Path("src/Devo6.WorkFlow.Engine/CompositeStep.cs")
          engine = engine_path.read_text(encoding="utf-8")
          engine = engine.replace(
              'IFormattable formattable => formattable.ToString(null, CultureInfo.InvariantCulture) ?? "null",',
              'IFormattable => ((IFormattable)boxedValue).ToString(null, CultureInfo.InvariantCulture) ?? "null",',
              1,
          )
          engine_path.write_text(engine, encoding="utf-8")

          design_path = Path("doc/issue-21-hierarchical-logging-design.md")
          design = design_path.read_text(encoding="utf-8")
          design = design.replace(
              "ネスト経路の lifecycle logger は次の優先順位で解決する。\n\n1. ルート workflow が `StepContext` に登録した engine 内部 logging context の engine logger。\n2. logging context がない standalone 実行では `StepContext.Logger`。\n\n内部 logging context は engine assembly 内部型として保持し、公開 API には追加しない。",
              "ネスト経路の lifecycle logger には `StepContext.Logger` を使用する。root workflow から呼び出された場合は外側の Entry と Step の scope chain を継承し、standalone `Execute` / `ExecuteAsync` でも同じ logger 契約を維持する。内部 logging context や公開 API は追加しない。",
          )
          design = design.replace(
              "nested Composite の lifecycle は、ルート workflow の内部 logging context を取得できる場合は `Devo6.WorkFlow.Engine` を使用する。\nstandalone `Execute` / `ExecuteAsync` では `StepContext.Logger` を使用する。",
              "nested Composite の lifecycle と simple execution の Step lifecycle は `StepContext.Logger` を使用するため、category は `Devo6.WorkFlow.Step` とする。",
          )
          design = design.replace(
              "- root workflow 用の内部 logging context を `StepContext` へ登録する。",
              "- nested Composite と simple execution の lifecycle は既存の `StepContext.Logger` を利用する。",
          )
          design = design.replace(
              "root workflow から内部 logging context を渡し、可能な限り engine category を使用する。\nstandalone 実行だけは `StepContext.Logger` へ fallback する。",
              "nested Composite の lifecycle は一貫して `StepContext.Logger` を使用する。外側 scope は logger provider の `AsyncLocal` chain により継承する。",
          )
          design_path.write_text(design, encoding="utf-8")
          PY

      - name: Format
        run: dotnet format Devo6.WorkFlow.sln --no-restore

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          dotnet test Devo6.WorkFlow.sln \
            --configuration Release \
            --no-restore \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults \
            2>&1 | tee TestResults/test-results.log

      - name: Diff check
        run: git diff --check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Commit verified fixes
        if: success()
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No verified fixes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Devo6.WorkFlow.Cli/EngineLoggingProvider.cs \
                  src/Devo6.WorkFlow.Engine/CompositeStep.cs \
                  doc/issue-21-hierarchical-logging-design.md
          git commit -m "fix: align hierarchical logging with repository standards"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
