name: PR xUnit Tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Devo6.WorkFlow.sln

      - name: Test
        shell: bash
        run: |
          mkdir -p TestResults
          set -o pipefail
          dotnet test Devo6.WorkFlow.sln --configuration Release --no-restore --verbosity minimal 2>&1 | tee TestResults/test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-xunit-test-log-${{ github.run_id }}
          path: TestResults/test.log
          if-no-files-found: error
