name: PR xUnit Tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pr-xunit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          dotnet restore Devo6.WorkFlow.sln \
            2>&1 | tee TestResults/restore.log

      - name: Prepare verified Switch case fix
        id: candidate
        if: always() && steps.restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/Devo6.WorkFlow.Engine/CompositeStep.cs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'throw new InvalidOperationException($"Switch case \'{value}\' is already registered.");',
                  'throw new InvalidOperationException("Switch case is already registered.");',
                  "duplicate case message",
              ),
              (
                  'EnsureCaseHasSteps(built, $"case \'{value}\'");',
                  'EnsureCaseHasSteps(built, "case");',
                  "case branch validation label",
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format candidate
        id: format
        if: always() && steps.candidate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet format Devo6.WorkFlow.sln --no-restore \
            2>&1 | tee TestResults/format.log

      - name: Test candidate
        id: tests
        if: always() && steps.format.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet test Devo6.WorkFlow.sln \
            --configuration Release \
            --no-restore \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults \
            2>&1 | tee TestResults/test-results.log

      - name: Diff check
        id: diff
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee TestResults/diff-check.log

      - name: Upload candidate and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-case-fix-${{ github.run_id }}
          path: |
            TestResults
            src/Devo6.WorkFlow.Engine/CompositeStep.cs
          if-no-files-found: error
          retention-days: 14

      - name: Report verification result
        if: always()
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        run: |
          failed=0
          for result in \
            "restore:${RESTORE_OUTCOME}" \
            "candidate:${CANDIDATE_OUTCOME}" \
            "format:${FORMAT_OUTCOME}" \
            "test:${TEST_OUTCOME}" \
            "diff:${DIFF_OUTCOME}"
          do
            name="${result%%:*}"
            outcome="${result#*:}"
            echo "${name}: ${outcome}"
            if [ "${outcome}" != "success" ]; then
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo "Candidate verification failed. Download the artifact for logs and TRX output."
            exit 1
          fi
