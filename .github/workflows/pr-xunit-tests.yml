name: PR xUnit Tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pr-xunit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Devo6.WorkFlow.sln

      - name: Format verification
        run: dotnet format Devo6.WorkFlow.sln --verify-no-changes --no-restore

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          dotnet test Devo6.WorkFlow.sln \
            --configuration Release \
            --no-restore \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults \
            2>&1 | tee TestResults/test-results.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
